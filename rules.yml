groups:
  - name: node-health
    rules:
      - alert: HighCPUUsageThinkCentre
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU alto no ThinkCentre"
          description: "CPU acima de 85% por mais de 2 minutos."
      - alert: HighDiskUsageThinkCentre
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espaço em disco baixo no ThinkCentre"
          description: "Menos de 15% de espaço livre em / há mais de 5 minutos."
  - name: infra-availability
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instância indisponível"
          description: "O alvo não responde ao scrape do Prometheus há mais de 1 minuto."
